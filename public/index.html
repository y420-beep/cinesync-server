<script>
'use strict';

// ===== НАСТРОЙКИ =====
const LIVEKIT_URL = 'wss://webrtc-if6vxkit.livekit.cloud'; // или возьмите из переменных, но можно оставить жёстко
// =====

const S = {
  ws: null,
  room: '',
  myName: '',
  isHost: false,
  isPlaying: false,
  isMicOn: false,
  syncTimer: null,
  reconTimer: null,
  reconCount: 0,
  hideTimer: null,
  isDragging: false,
  pendingVoiceVol: 0.8,
  wakeLock: null,
  peers: new Set(),
  callStartTime: null,
  callTimerInterval: null,
  currentTab: 'tmdb',
  isYouTube: false,
  lkRoom: null,
  localAudioTrack: null,
  remoteAudioElements: new Map(),
  livekitToken: null, // будет получен от сервера
};
const $ = id => document.getElementById(id);
const videoEl = $('vid');
const ytEl = $('yt-player');
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';

/* ===== СТАРЫЙ КОД (звёзды, сплеш, утилиты, панели и т.д.) ===== */
/* ВАЖНО: скопируйте все функции из вашего предыдущего файла, кроме тех, что касаются генерации токена и LiveKit */
/* Ниже я приведу только изменённые/добавленные части */

// ===== НОВАЯ ФУНКЦИЯ ИНИЦИАЛИЗАЦИИ ГОЛОСА (без генерации токена) =====
async function initVoice() {
  if (S.lkRoom) return;
  if (!S.livekitToken) {
    toast('⏳ Ожидание токена...');
    return;
  }

  const room = new Livekit.Room();
  S.lkRoom = room;

  try {
    await room.connect(LIVEKIT_URL, S.livekitToken);
  } catch (e) {
    console.error('Ошибка подключения к LiveKit:', e);
    toast('❌ Не удалось подключиться к голосовому серверу');
    S.lkRoom = null;
    return;
  }

  console.log('Подключено к LiveKit');
  await enableMicrophone();

  room.on('trackSubscribed', (track, publication, participant) => {
    if (track.kind === 'audio') {
      const audioEl = document.createElement('audio');
      audioEl.autoplay = true;
      audioEl.volume = S.pendingVoiceVol || 0.8;
      audioEl.muted = false;
      audioEl.style.display = 'none';
      document.body.appendChild(audioEl);
      track.attach(audioEl);
      S.remoteAudioElements.set(participant.identity, audioEl);

      if (!S.peers.has(participant.identity)) {
        addPeerToPanel(participant.identity);
      }
    }
  });

  room.on('trackUnsubscribed', (track, publication, participant) => {
    if (track.kind === 'audio') {
      const el = S.remoteAudioElements.get(participant.identity);
      if (el) {
        el.remove();
        S.remoteAudioElements.delete(participant.identity);
      }
    }
  });

  room.on('participantConnected', (participant) => {
    toast('👤 ' + participant.identity + ' подключился');
    if (!S.peers.has(participant.identity)) {
      addPeerToPanel(participant.identity);
    }
  });

  room.on('participantDisconnected', (participant) => {
    toast('👋 ' + participant.identity + ' вышел');
    removePeerFromPanel(participant.identity);
    const el = S.remoteAudioElements.get(participant.identity);
    if (el) el.remove();
    S.remoteAudioElements.delete(participant.identity);
  });

  room.on('audioLevel', (levels) => {
    for (const [identity, level] of levels) {
      if (identity === S.myName) continue;
      const isTalking = level > 0.08;
      setPeerTalking(identity, isTalking);
      updatePeerVolume(identity, Math.min(level * 2, 1));
    }
  });

  startCallTimer();
  toast('🎤 Голосовой чат активен');
}

// ===== ОБРАБОТЧИК СООБЩЕНИЙ (добавляем получение токена) =====
function handleMsg(m) {
  switch (m.type) {
    case 'joined':
      $('connect').classList.add('hidden');
      $('main').classList.remove('hidden');
      $('room-code-panel').textContent = S.room;
      $('self-name').textContent = S.myName;
      $('self-avatar').textContent = getInitials(S.myName);
      $('self-role').textContent = S.isHost ? 'админ' : 'гость';
      showStatus('Комната ' + S.room, 'ok');
      if (m.peers) {
        m.peers.forEach(p => {
          if (p !== S.myName) addPeerToPanel(p);
        });
      }
      // Если есть другие участники, инициируем голос (но ждём токен)
      if (m.peers && m.peers.length > 0) {
        // Токен придёт отдельным сообщением
      }
      toast(S.isHost ? 'Комната: ' + S.room : 'Подключено!');
      break;

    case 'livekit-token':
      S.livekitToken = m.token;
      // Если уже есть участники, инициируем голос
      if (S.peers.size > 0) {
        initVoice();
      }
      break;

    case 'peer-joined':
      toast('👤 ' + m.name + ' подключился');
      addPeerToPanel(m.name);
      if (!S.callTimerInterval) {
        // Если ещё нет голосовой комнаты, создаём
        if (!S.lkRoom && S.livekitToken) {
          initVoice();
        }
        startCallTimer();
      }
      break;

    case 'peer-left':
      toast('👋 ' + m.name + ' вышел');
      removePeerFromPanel(m.name);
      const el = S.remoteAudioElements.get(m.name);
      if (el) el.remove();
      S.remoteAudioElements.delete(m.name);
      if (S.peers.size === 0) {
        stopCallTimer();
      }
      break;

    case 'sync':
      handleSync(m);
      break;

    default:
      // Игнорируем остальное
      break;
  }
}
